<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备录入</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f5f7fa; margin: 0; padding: 16px; color: #1f2937; }
        .wrap { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 8px 0 12px; }
        nav { display: flex; gap: 12px; margin-bottom: 12px; font-size: 14px; }
        nav a { color: #0052A5; text-decoration: none; padding: 6px 10px; border-radius: 6px; background: #fff; border: 1px solid #d1d5db; }
        nav a.on { background: #0052A5; color: #fff; border-color: #0052A5; }
        fieldset { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px 16px; margin: 0 0 14px; }
        legend { font-weight: 600; padding: 0 6px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
        label { display: flex; flex-direction: column; font-size: 13px; color: #374151; gap: 4px; }
        input, textarea { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
        textarea { min-height: 56px; resize: vertical; }
        .row-list { display: flex; flex-direction: column; gap: 8px; }
        .row { display: grid; gap: 8px; align-items: center; }
        .row.lines { grid-template-columns: 1fr 2fr 32px; }
        .row.roles { grid-template-columns: 1.2fr 1fr 1fr 32px; }
        .row.tests { grid-template-columns: 1.2fr 1fr 0.6fr 32px; }
        .del { border: 0; background: #fee2e2; color: #b91c1c; border-radius: 6px; cursor: pointer; height: 32px; }
        .add { margin-top: 8px; border: 1px dashed #9ca3af; background: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; color: #374151; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
        button.primary { background: #0052A5; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
        button.ghost { background: #fff; border: 1px solid #9ca3af; border-radius: 6px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .msg { font-size: 13px; border-radius: 6px; padding: 8px 12px; margin: 10px 0; display: none; }
        .msg.err { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; }
        .msg.ok { color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; }
        .msg.show { display: block; }
        .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
        .hidden { display: none !important; }
        .login { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
        .login .state { font-size: 13px; color: #374151; flex: 1; }
        .qr { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-top: 12px; display: flex; gap: 14px; align-items: center; }
        .qr img { width: 160px; height: 160px; border: 1px solid #e5e7eb; }
        .qr .info { flex: 1; font-size: 13px; color: #374151; word-break: break-all; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>设备录入</h1>
    <nav>
        <a href="entry.html" class="on">录入设备</a>
        <a href="list.html">设备列表</a>
    </nav>

    <div class="login">
        <div class="state" id="loginState">未登录。录入需要账号（管理员或录入员）。</div>
        <label>账号<input id="lgUser" autocomplete="username" style="width:140px"></label>
        <label>密码<input id="lgPass" type="password" autocomplete="current-password" style="width:140px"></label>
        <button type="button" class="primary" id="btnLogin">登录</button>
        <button type="button" class="ghost hidden" id="btnLogout">退出登录</button>
    </div>

    <div id="msg" class="msg"></div>

    <fieldset>
        <legend>产品基本信息</legend>
        <div class="grid">
            <label>产品型号 *<input id="model" placeholder="如 E15"></label>
            <label>出厂编号 *<input id="factoryNo" placeholder="如 OLY-2026050078"></label>
            <label>生产批次 *<input id="batch" placeholder="如 2026-05-001"></label>
            <label>生产日期 *<input id="date" placeholder="如 2026年5月7日"></label>
            <label>保修期限<input id="warranty" value="整机保修2年"></label>
        </div>
    </fieldset>

    <fieldset>
        <legend>原材料追溯</legend>
        <div id="materials" class="row-list"></div>
        <button type="button" class="add" data-add="materials">+ 添加原材料</button>
        <div class="hint">名称可选填：压缩机、换热器铜管、风机、制冷剂，或自定义。内容每行一条。</div>
    </fieldset>

    <fieldset>
        <legend>生产过程</legend>
        <div id="process" class="row-list"></div>
        <button type="button" class="add" data-add="process">+ 添加工序</button>
        <div class="hint">工序如「装配」「焊接」「充注」「检验」，内容每行一条。</div>
    </fieldset>

    <fieldset>
        <legend>工序人员</legend>
        <div id="personnel" class="row-list"></div>
        <button type="button" class="add" data-add="personnel">+ 添加人员</button>
        <div class="hint">每行一位：工序、姓名、角色（如班组长、操作员、检验员）。</div>
    </fieldset>

    <fieldset>
        <legend>出厂检验报告</legend>
        <div id="inspections" class="row-list"></div>
        <button type="button" class="add" data-add="inspections">+ 添加检验项</button>
        <div class="hint">结果默认「合格」。单位可留空，数值会附加单位（如 kW）。</div>
    </fieldset>

    <div class="actions">
        <button type="button" class="primary" id="btnSave">保存设备</button>
        <button type="button" class="ghost" id="btnClear">清空表单</button>
    </div>

    <div id="qrArea" class="qr hidden">
        <img id="qrImg" alt="追溯二维码">
        <div class="info">
            <div id="qrTitle"></div>
            <div id="qrUrl" style="margin:6px 0"></div>
            <button type="button" class="primary" id="btnQrDownload">下载二维码 PNG</button>
        </div>
    </div>
</div>

<script>
(function () {
    // 后端地址：与本页同域部署时为空字符串；本机调试时可改为 https://trace-api.olywell.com
    var API_BASE = 'https://trace-api.olywell.com';
    var TOKEN_KEY = null; // 令牌仅保存在内存中，刷新页面需重新登录

    var token = null;
    var role = null;
    var $ = function (id) { return document.getElementById(id); };

    function setMsg(text, kind) {
        var m = $('msg');
        m.textContent = text;
        m.className = 'msg show ' + (kind || 'err');
    }

    function api(path, opts) {
        opts = opts || {};
        var headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(API_BASE + path, {
            method: opts.method || 'GET',
            headers: headers,
            body: opts.body ? JSON.stringify(opts.body) : undefined
        }).then(function (res) {
            return res.text().then(function (t) {
                var data = null;
                try { data = t ? JSON.parse(t) : null; } catch (e) { data = t; }
                if (!res.ok) {
                    var detail = (data && data.detail) ? (Array.isArray(data.detail) ? data.detail.map(function (d) { return d.msg; }).join('；') : data.detail) : ('HTTP ' + res.status);
                    throw new Error(detail);
                }
                return data;
            });
        });
    }

    function updateLoginState() {
        var logged = !!token;
        $('loginState').textContent = logged ? ('已登录：' + role + '（令牌仅保存在本页内存中）') : '未登录。录入需要账号（管理员或录入员）。';
        $('btnLogin').classList.toggle('hidden', logged);
        $('btnLogout').classList.toggle('hidden', !logged);
        $('lgUser').classList.toggle('hidden', logged);
        $('lgPass').classList.toggle('hidden', logged);
        $('btnSave').disabled = !logged || role === 'viewer';
    }

    $('btnLogin').addEventListener('click', function () {
        var u = $('lgUser').value.trim();
        var p = $('lgPass').value;
        if (!u || !p) { setMsg('请输入账号和密码'); return; }
        api('/api/auth/login', { method: 'POST', body: { username: u, password: p } })
            .then(function (d) {
                token = d.access_token;
                $('lgPass').value = '';
                // 角色从令牌载荷读取，仅用于前端提示，权限以后端校验为准
                try { role = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).role; } catch (e) { role = '已登录'; }
                updateLoginState();
                setMsg('登录成功', 'ok');
            })
            .catch(function (e) { setMsg('登录失败：' + e.message); });
    });

    $('btnLogout').addEventListener('click', function () {
        token = null; role = null; updateLoginState();
        setMsg('已退出登录', 'ok');
    });

    function rowEl(cls, children) {
        var row = document.createElement('div');
        row.className = 'row ' + cls;
        children.forEach(function (c) { row.appendChild(c); });
        var del = document.createElement('button');
        del.type = 'button'; del.className = 'del'; del.textContent = '×';
        del.addEventListener('click', function () { row.remove(); });
        row.appendChild(del);
        return row;
    }
    function field(name, placeholder, tag) {
        var el = document.createElement(tag || 'input');
        el.dataset.field = name;
        el.placeholder = placeholder;
        return el;
    }

    var ROWS = {
        materials: function (v) { return rowEl('lines', [field('name', '名称，如 压缩机'), field('content', '内容，每行一条', 'textarea')]); },
        process: function (v) { return rowEl('lines', [field('name', '工序，如 装配'), field('content', '内容，每行一条', 'textarea')]); },
        personnel: function (v) { return rowEl('roles', [field('process', '工序，如 装配'), field('person', '姓名'), field('role', '角色，如 班组长')]); },
        inspections: function (v) { return rowEl('tests', [field('name', '检验项，如 制冷量'), field('value', '数值，如 14.7'), field('unit', '单位')]); }
    };

    function addRow(kind, values) {
        var row = ROWS[kind]();
        if (values) {
            Array.prototype.forEach.call(row.querySelectorAll('[data-field]'), function (f) {
                f.value = values[f.dataset.field] || '';
            });
        }
        $(kind).appendChild(row);
    }

    function readRows(kind) {
        return Array.prototype.map.call($(kind).children, function (row) {
            var o = {};
            Array.prototype.forEach.call(row.querySelectorAll('[data-field]'), function (f) { o[f.dataset.field] = f.value.trim(); });
            return o;
        });
    }

    function clearRows() {
        ['materials', 'process', 'personnel', 'inspections'].forEach(function (k) { $(k).innerHTML = ''; });
    }

    function collect() {
        var materials = readRows('materials').filter(function (r) { return r.name; }).map(function (r) {
            return { name: r.name, content: r.content.replace(/\r/g, '') };
        });
        var process = readRows('process').filter(function (r) { return r.name; }).map(function (r) {
            return { name: r.name, content: r.content.replace(/\r/g, '') };
        });
        var personnel = readRows('personnel').filter(function (r) { return r.process || r.person; });
        var inspections = readRows('inspections').filter(function (r) { return r.name; }).map(function (r) {
            return { name: r.name, value: r.value, unit: r.unit || '', result: '合格' };
        });
        return {
            factory_no: $('factoryNo').value.trim(),
            model: $('model').value.trim(),
            batch: $('batch').value.trim(),
            production_date: $('date').value.trim(),
            warranty: $('warranty').value.trim() || '整机保修2年',
            materials: materials,
            process: process,
            personnel: personnel,
            inspections: inspections
        };
    }

    function validate(d) {
        var miss = [];
        if (!d.model) miss.push('产品型号');
        if (!d.factory_no) miss.push('出厂编号');
        if (!d.batch) miss.push('生产批次');
        if (!d.production_date) miss.push('生产日期');
        return miss.length ? ('请填写：' + miss.join('、')) : '';
    }

    function showQr(factoryNo) {
        var img = $('qrImg');
        var url = API_BASE + '/api/devices/' + encodeURIComponent(factoryNo) + '/qr.png';
        img.src = url;
        $('qrTitle').textContent = '出厂编号：' + factoryNo;
        $('qrUrl').textContent = '追溯地址由二维码内容决定，下载后扫码即可打开追溯页。';
        $('qrArea').classList.remove('hidden');
        $('btnQrDownload').onclick = function () {
            fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = factoryNo.replace(/[\\\/:*?"<>|]/g, '_') + '.png';
                a.click();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
            });
        };
    }

    $('btnSave').addEventListener('click', function () {
        var d = collect();
        var err = validate(d);
        if (err) { setMsg(err); return; }
        api('/api/devices', { method: 'POST', body: d })
            .then(function () {
                setMsg('保存成功：' + d.factory_no, 'ok');
                showQr(d.factory_no);
            })
            .catch(function (e) { setMsg('保存失败：' + e.message); });
    });

    $('btnClear').addEventListener('click', function () {
        ['model', 'factoryNo', 'batch', 'date'].forEach(function (k) { $(k).value = ''; });
        $('warranty').value = '整机保修2年';
        clearRows();
        $('qrArea').classList.add('hidden');
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-add]'), function (btn) {
        btn.addEventListener('click', function () { addRow(btn.dataset.add); });
    });

    ['materials', 'process', 'personnel', 'inspections'].forEach(function (k) { addRow(k); });
    updateLoginState();
})();
</script>
</body>
</html>
