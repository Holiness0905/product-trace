<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>产品追溯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #0052A5 0%, #003d7a 100%);
            min-height: 100vh;
        }
        .page { max-width: 100%; margin: 0 auto; background: #f5f5f5; min-height: 100vh; }
        .header {
            background: linear-gradient(135deg, #0052A5 0%, #003d7a 100%);
            color: white;
            padding: 32px 20px 24px;
            text-align: center;
        }
        .logo { font-size: 48px; margin-bottom: 12px; }
        .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
        .header .tag {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 8px;
        }
        .product-card {
            background: white;
            margin: -20px 16px 12px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }
        .product-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .product-row:last-child { border-bottom: none; }
        .product-row .label { color: #999; }
        .product-row .value { color: #333; font-weight: 600; }
        .section {
            background: white;
            margin: 12px 16px;
            border-radius: 16px;
            overflow: hidden;
        }
        .section-title {
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .icon {
            width: 28px;
            height: 28px;
            background: #0052A5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }
        .info-list { padding: 8px 16px; }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid #f8f8f8;
            font-size: 13px;
        }
        .info-item:last-child { border-bottom: none; }
        .info-item .key { color: #666; flex-shrink: 0; width: 90px; }
        .info-item .val { color: #333; text-align: right; flex: 1; line-height: 1.5; }
        .test-list { padding: 8px 16px; }
        .test-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .test-item:last-child { border-bottom: none; }
        .test-name { color: #333; }
        .test-result { display: flex; align-items: center; gap: 6px; }
        .test-value { color: #059669; font-weight: 600; }
        .pass-badge {
            background: #10b981;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .quality-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: #f0f0f0;
        }
        .quality-item { background: white; padding: 16px; text-align: center; }
        .quality-item .cert { font-size: 12px; color: #666; margin-bottom: 4px; }
        .quality-item .code { font-size: 14px; color: #0052A5; font-weight: 600; }
        .footer {
            background: #1f2937;
            color: white;
            padding: 20px 16px;
            text-align: center;
            margin-top: 12px;
        }
        .footer .company { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .footer .info { font-size: 11px; opacity: 0.7; line-height: 1.8; }
        .notice {
            background: #fef3c7;
            margin: 12px 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            color: #92400e;
            text-align: center;
            border-left: 4px solid #f59e0b;
        }
        .msg { color: #b91c1c; text-align: center; padding: 60px 16px; font-size: 15px; background: #fff; }
    </style>
</head>
<body>
<div class="page" id="page"></div>
<script>
    (function () {
        var page = document.getElementById('page');

        // 所有数据通过 textContent 或文本节点写入, 不使用 innerHTML, 避免注入
        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined && text !== null) node.textContent = text;
            return node;
        }

        function appendLines(parent, lines) {
            lines.forEach(function (line, i) {
                if (i > 0) parent.appendChild(document.createElement('br'));
                parent.appendChild(document.createTextNode(line));
            });
        }

        function sectionTitle(icon, title) {
            var t = el('div', 'section-title');
            t.appendChild(el('div', 'icon', icon));
            t.appendChild(document.createTextNode(title));
            return t;
        }

        function showMessage(text) {
            page.innerHTML = '';
            page.appendChild(el('div', 'msg', text));
        }

        function renderSection(sec) {
            var box = el('div', 'section');
            box.appendChild(sectionTitle(sec.icon || '', sec.title));

            if (sec.kind === 'tests') {
                var testList = el('div', 'test-list');
                sec.items.forEach(function (t) {
                    var row = el('div', 'test-item');
                    row.appendChild(el('span', 'test-name', t.name));
                    var res = el('div', 'test-result');
                    res.appendChild(el('span', 'test-value', t.value));
                    res.appendChild(el('span', 'pass-badge', t.result));
                    row.appendChild(res);
                    testList.appendChild(row);
                });
                box.appendChild(testList);
            } else {
                var list = el('div', 'info-list');
                sec.items.forEach(function (item) {
                    var row = el('div', 'info-item');
                    row.appendChild(el('span', 'key', item.name));
                    var val = el('span', 'val');
                    appendLines(val, item.lines);
                    row.appendChild(val);
                    list.appendChild(row);
                });
                box.appendChild(list);
            }
            return box;
        }

        // site 为全局配置 (标题、证书、页脚等), 由 build.py 写入; 录入页导出的 products.json 可能不含 site, 此时使用默认值
        var DEFAULT_SITE = {
            title: '产品追溯', subtitle: '全生命周期质量追溯', logo: '',
            company: '', system: '', validity_years: '', notice: [],
            certs: [], warranty_name: '保修政策', generated_at: ''
        };

        function render(data, product) {
            var site = Object.assign({}, DEFAULT_SITE, data.site || {});
            page.innerHTML = '';

            var header = el('div', 'header');
            header.appendChild(el('div', 'logo', site.logo || ''));
            header.appendChild(el('h1', null, site.title));
            header.appendChild(el('div', 'tag', site.subtitle));
            page.appendChild(header);

            var card = el('div', 'product-card');
            product.card.forEach(function (row) {
                var r = el('div', 'product-row');
                r.appendChild(el('span', 'label', row.label));
                r.appendChild(el('span', 'value', row.value));
                card.appendChild(r);
            });
            page.appendChild(card);

            product.sections.forEach(function (sec) {
                page.appendChild(renderSection(sec));
            });

            var certSec = el('div', 'section');
            certSec.appendChild(sectionTitle('🏆', '质量认证'));
            var grid = el('div', 'quality-grid');
            site.certs.forEach(function (c) {
                var item = el('div', 'quality-item');
                item.appendChild(el('div', 'cert', c.cert));
                item.appendChild(el('div', 'code', c.code));
                grid.appendChild(item);
            });
            var warranty = el('div', 'quality-item');
            warranty.appendChild(el('div', 'cert', site.warranty_name));
            warranty.appendChild(el('div', 'code', product.warranty));
            grid.appendChild(warranty);
            certSec.appendChild(grid);
            page.appendChild(certSec);

            var notice = el('div', 'notice');
            site.notice.forEach(function (line, i) {
                if (i > 0) notice.appendChild(document.createElement('br'));
                notice.appendChild(document.createTextNode(line));
            });
            page.appendChild(notice);

            var footer = el('div', 'footer');
            footer.appendChild(el('div', 'company', site.company));
            var info = el('div', 'info');
            info.appendChild(document.createTextNode(site.system));
            info.appendChild(document.createElement('br'));
            info.appendChild(document.createTextNode('数据生成: ' + site.generated_at));
            info.appendChild(document.createElement('br'));
            info.appendChild(document.createTextNode('追溯有效期: ' + site.validity_years + '年'));
            footer.appendChild(info);
            page.appendChild(footer);

            document.title = site.title + ' - ' + product.id;
        }

        var id = new URLSearchParams(location.search).get('id');
        if (!id) {
            showMessage('未指定产品编号');
            return;
        }

        // 后端返回扁平字段，这里转换为 render() 所需的 card / sections 结构
        function toProduct(d) {
            function lines(items, key) {
                return (items || []).map(function (it) {
                    return { name: it.name, lines: (it.content || '').split('\n').filter(Boolean) };
                });
            }
            return {
                id: d.factory_no,
                card: [
                    { label: '产品型号', value: d.model },
                    { label: '生产批次', value: d.batch },
                    { label: '出厂编号', value: d.factory_no },
                    { label: '生产日期', value: d.production_date }
                ],
                sections: [
                    { title: '原材料追溯', icon: '📦', kind: 'lines', items: lines(d.materials) },
                    { title: '生产过程', icon: '⚙️', kind: 'lines', items: lines(d.process) },
                    {
                        title: '出厂检验报告', icon: '✅', kind: 'tests',
                        items: (d.inspections || []).map(function (t) {
                            return { name: t.name, value: t.value + (t.unit || ''), result: t.result || '合格' };
                        })
                    }
                ],
                warranty: d.warranty
            };
        }

        // api_base 与 site 配置统一从 config.json 读取，只需改一处
        fetch('config.json', { cache: 'no-cache' })
            .then(function (r) { return r.json(); })
            .then(function (cfg) {
                return fetch(cfg.api_base + '/api/devices/' + encodeURIComponent(id), { cache: 'no-cache' })
                    .then(function (res) {
                        if (res.status === 404) {
                            showMessage('未找到该产品的追溯信息');
                            return;
                        }
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json().then(function (d) {
                            render({ site: cfg.site }, toProduct(d));
                        });
                    });
            })
            .catch(function () {
                showMessage('追溯信息加载失败');
            });
    })();
</script>
</body>
</html>
